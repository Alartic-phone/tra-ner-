# ALARTIC — Stack de développement local
#
# Services d'infrastructure pour le développement de apps/api/ (Rust/Axum).
# Le binaire Rust tourne sur l'hôte (cargo watch), pas dans Docker, pour
# garder le hot reload rapide.
#
# Usage :
#   npm run db:up        # démarre Postgres + Mailpit en arrière-plan
#   npm run db:logs      # suit les logs
#   npm run db:down      # arrête tout
#   npm run db:reset     # détruit + recrée (utile après migration cassée)
#
# Mailpit web UI : http://localhost:8025
# Postgres expose : localhost:5432 (utilisé par le binaire Rust en host)
#
# Aucun secret en dur ici. Copier .env.example → .env (gitignored) et adapter.
# En prod (J5) : Postgres provisionné sur VPS Cloud avec LUKS, secrets via
# gestionnaire Infomaniak.

services:
  postgres:
    image: postgres:16-alpine
    container_name: alartic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alartic_dev}
      POSTGRES_USER: ${POSTGRES_USER:-alartic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
      # Encoding et locale FR pour les recherches sur noms / adresses
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Port hôte 5433 (le 5432 est pris par un autre projet local, shadosint).
      # Bind sur localhost uniquement, pas 0.0.0.0.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alartic} -d ${POSTGRES_DB:-alartic_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    # Mailpit capture tous les emails sortants en dev — UI web à 8025.
    # Le code Rust envoie via SMTP localhost:1025, on visualise les emails
    # dans le navigateur sans rien envoyer à la vraie boîte.
    image: axllent/mailpit:latest
    container_name: alartic-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"  # SMTP
      - "127.0.0.1:8025:8025"  # Web UI
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1  # dev only : pas d'auth SMTP requise
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres-data:
    name: alartic-postgres-data
