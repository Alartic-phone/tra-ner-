# ALARTIC — Decap CMS configuration
#
# Source de vérité : Cahier_des_charges_ALARTIC_Version_Finale.pdf §3.5.
# Tout l'éditorial passe par Decap (extension confirmée 2026-05-11).
#
# Couverture actuelle (J2.5) :
#   - Produits     : content/products/ — 10 fiches Pixel + tablette
#   - FAQ          : content/faq/      — questions/réponses par catégorie
#
# À migrer en .md éditable par Decap avant la formation client (J5) :
#   - Manifeste, À propos, Compatibilité, Sécurité, Rapport transparence
#   - Pages légales (Mentions, CGV, RGPD, Garantie, Cookies)
#   (actuellement en .astro avec contenu en dur — refactor prévu en J2.5)

# ─────────── Backend ───────────
# CDC §3.5 + ADR Codeberg/Forgejo : on cible le repo Forgejo de Codeberg.
# Decap supporte le backend `gitea` qui fonctionne aussi avec Forgejo.
# L'OAuth application sera créée côté Codeberg en J5, avant la MEP.
backend:
  name: gitea
  repo: Le_Dozo/Alartic
  branch: main
  api_root: https://codeberg.org/api/v1
  base_url: https://codeberg.org
  auth_endpoint: login/oauth/authorize
  # app_id à renseigner après création de l'OAuth Codeberg (J5)
  app_id: REPLACE_ME_FORGEJO_OAUTH_APP_ID

# Activé en dev local — démarre via `npx decap-server` sur :8081,
# lit/écrit directement les fichiers du repo sans OAuth.
local_backend: true

# ─────────── Media (images produits) ───────────
media_folder: "apps/web/public/products"
public_folder: "/products"

# CDC §5.4 : aucune ressource tierce. Decap servi en local.
site_url: https://alartic.fr
logo_url: /logo.png

# ─────────── Collections ───────────
collections:
  # ───── Produits ─────
  - name: products
    label: Produits
    label_singular: Produit
    folder: apps/web/content/products
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}} — à partir de {{storages[0].price}} €"
    sortable_fields: ["order", "name"]
    fields:
      - { name: title, label: "Titre (SEO)", widget: string }
      - { name: name, label: "Nom commercial", widget: string }
      - { name: shortDescription, label: "Tagline courte", widget: text }
      - name: series
        label: "Série"
        widget: select
        options:
          - { label: "Pixel 9", value: "pixel-9" }
          - { label: "Pixel 10", value: "pixel-10" }
          - { label: "Tablette", value: "tablet" }
      - name: format
        label: "Format"
        widget: select
        options:
          - { label: "Téléphone", value: "phone" }
          - { label: "Pliable", value: "fold" }
          - { label: "Tablette", value: "tablet" }
      - { name: available, label: "Disponible à la vente", widget: boolean, default: true }
      - { name: order, label: "Ordre d'affichage", widget: number, value_type: "int", min: 1 }
      - { name: stock, label: "Stock (laisser vide si en stock)", widget: number, value_type: "int", min: 0, required: false }

      - name: colors
        label: "Couleurs"
        widget: list
        label_singular: "Couleur"
        summary: "{{fields.name}} ({{fields.hex}})"
        fields:
          - { name: slug, label: "Slug", widget: string, hint: "Identifiant URL, ex: obsidian" }
          - { name: name, label: "Nom affiché", widget: string }
          - { name: hex, label: "Code couleur", widget: color, allowInput: true }
          - { name: frontImage, label: "Image face avant (SVG)", widget: image, media_library: { config: { multiple: false } } }
          - { name: rearImage, label: "Image face arrière (optionnel)", widget: image, required: false }

      - name: storages
        label: "Capacités de stockage"
        widget: list
        label_singular: "Capacité"
        summary: "{{fields.label}} — {{fields.price}} €"
        fields:
          - { name: slug, label: "Slug", widget: string, hint: "ex: 128go" }
          - { name: label, label: "Libellé", widget: string }
          - { name: price, label: "Prix (€ TTC)", widget: number, value_type: "int", min: 1 }
          - { name: payplugUrl, label: "URL Payplug (renseignée en J4)", widget: string, required: false }

      - name: included
        label: "Inclus dans le Pack ALARTIC"
        widget: list
        field: { name: item, label: "Élément inclus", widget: string }

      - { name: warranty, label: "Texte garantie L217-3 + ALARTIC", widget: text }

      - name: specs
        label: "Spécifications techniques"
        widget: list
        label_singular: "Spec"
        summary: "{{fields.label}} : {{fields.value}}"
        fields:
          - { name: label, label: "Caractéristique", widget: string }
          - { name: value, label: "Valeur", widget: string }

      - { name: body, label: "Description longue (Markdown)", widget: markdown }

  # ───── FAQ ─────
  - name: faq
    label: FAQ
    label_singular: Question
    folder: apps/web/content/faq
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: question
    summary: "[{{category}}] {{question}}"
    sortable_fields: ["order", "category"]
    fields:
      - { name: question, label: "Question", widget: string }
      - name: category
        label: "Catégorie"
        widget: select
        options:
          - { label: "Général", value: "general" }
          - { label: "Commande & paiement", value: "commande" }
          - { label: "Livraison", value: "livraison" }
          - { label: "SAV", value: "sav" }
          - { label: "Garantie", value: "garantie" }
          - { label: "Technique & GrapheneOS", value: "technique" }
          - { label: "Vie privée", value: "privacy" }
      - { name: order, label: "Ordre dans la catégorie", widget: number, value_type: "int", min: 1 }
      - { name: body, label: "Réponse (Markdown)", widget: markdown }
